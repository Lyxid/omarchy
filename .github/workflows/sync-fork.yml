name: Sync Fork

on:
  schedule:
    # Exécution automatique toutes les 6 heures
    - cron: '0 */6 * * *'
  # Permet aussi de lancer la synchro manuellement depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Synchroniser avec le dépôt upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/merge-upstream \
            -f branch="main"
